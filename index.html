<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Arrowvine: a 1000-level arrow puzzle. Clear every arrow by tapping the ones with a free path.">
<meta name="theme-color" content="#2f64e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arrowvine">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
[hidden] { display: none !important; }
</style>
<title>Arrowvine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one full-height app with three screens (home, vine map, board). A coin chip stays top right on every screen. */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #e4e8ef;
  --ink: #171c28;
  --ink-soft: #667085;
  --line: #d3d8e2;
  --vine: #2f64e8;
  --vine-deep: #1f48b0;
  --leaf: #7ea2f2;
  --arrow: #171c28;
  --coin: #2f64e8;
  --coin-ink: #ffffff;
  --bad: #e03a3e;
  --good: #2f64e8;
  --shadow: 0 6px 20px rgba(24, 36, 70, .13);
  --font-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1118; --surface: #1a1f2b; --surface-2: #272e3d; --ink: #eaeef6; --ink-soft: #9aa4b8;
    --line: #2f3748; --vine: #5b8cff; --vine-deep: #3a69e0; --leaf: #86a9ff; --arrow: #eaeef6;
    --coin: #5b8cff; --coin-ink: #0b1020; --bad: #ff6b6f; --good: #7fa5ff;
    --shadow: 0 6px 20px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1118; --surface: #1a1f2b; --surface-2: #272e3d; --ink: #eaeef6; --ink-soft: #9aa4b8;
  --line: #2f3748; --vine: #5b8cff; --vine-deep: #3a69e0; --leaf: #86a9ff; --arrow: #eaeef6;
  --coin: #5b8cff; --coin-ink: #0b1020; --bad: #ff6b6f; --good: #7fa5ff;
  --shadow: 0 6px 20px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--coin); outline-offset: 2px; }
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen[hidden] { display: none; }
.wrap { width: 100%; max-width: 520px; margin: 0 auto; }

/* top bar + coin chip */
.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 56px; flex: none; padding-top: env(safe-area-inset-top, 0px);
  box-sizing: content-box;
}
.bar h2 { margin: 0; font: 600 18px/1.1 var(--font-display); text-align: center; min-width: 0; flex: 1; }
.bar h2 small { display: block; font: 700 12px var(--font-body); color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
.round {
  width: 46px; height: 46px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow);
  display: grid; place-items: center; flex: none;
}
.round svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.coins {
  display: flex; align-items: center; gap: 7px; height: 42px; padding: 0 14px 0 8px; border-radius: 21px;
  background: var(--surface); box-shadow: var(--shadow); font: 600 18px var(--font-display);
  font-variant-numeric: tabular-nums; flex: none;
}
.coin-dot {
  width: 26px; height: 26px; border-radius: 50%; background: var(--coin); color: var(--coin-ink);
  display: grid; place-items: center; font: 700 14px var(--font-display); box-shadow: inset 0 -3px 0 rgba(0,0,0,.14);
}
.coins.pop { animation: pop .5s ease; }
@keyframes pop { 30% { transform: scale(1.18); } 100% { transform: scale(1); } }

/* home */
#home { overflow-y: auto; }
#home .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 22px; padding-bottom: 28px; min-height: min-content; }
.logo { text-align: center; }
.logo h1 { margin: 0; font: 700 clamp(44px, 12vw, 64px)/1 var(--font-display); letter-spacing: -.01em; color: var(--vine); }
.logo p { margin: 8px 0 0; color: var(--ink-soft); font-weight: 700; }
.play {
  min-width: 200px; height: 62px; border-radius: 31px; background: var(--vine); color: #fff;
  font: 600 26px var(--font-display); letter-spacing: .02em; box-shadow: 0 6px 0 var(--vine-deep), var(--shadow);
  transition: transform .12s, box-shadow .12s; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.play svg { width: 22px; height: 22px; fill: #fff; }
.play:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--vine-deep), var(--shadow); }
.theme { display: flex; align-items: center; gap: 12px; }
.theme > span { font-weight: 800; font-size: 14px; color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; }
.seg { display: flex; background: var(--surface-2); border-radius: 22px; padding: 4px; gap: 4px; }
.seg button { height: 36px; padding: 0 16px; border-radius: 18px; font-weight: 800; color: var(--ink-soft); display: flex; align-items: center; gap: 7px; }
.seg button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.14); }
.linkish { font-weight: 700; font-size: 13px; color: var(--ink-soft); text-decoration: underline; padding: 6px 10px; }

/* vine map */
.scroller { flex: 1; overflow-y: auto; overflow-x: hidden; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)); scrollbar-width: thin; }
.vine { position: relative; margin: 0 auto; width: 100%; max-width: 480px; }
.vine svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.stem { fill: none; stroke: var(--vine); stroke-width: 9; stroke-linecap: round; }
.stem-hi { fill: none; stroke: var(--leaf); stroke-width: 3; stroke-linecap: round; opacity: .7; }
.leaf { fill: var(--leaf); opacity: .9; }
.leaf.alt { fill: var(--vine); }
.node {
  position: absolute; width: 58px; height: 58px; transform: translate(-50%, -50%); border-radius: 50%;
  display: grid; place-items: center; font: 600 22px var(--font-display); font-variant-numeric: tabular-nums;
  background: var(--surface-2); color: var(--ink-soft); border: 4px solid var(--bg); box-shadow: var(--shadow);
}
.node.done { background: var(--vine); color: #fff; }
.node.current { background: var(--bad); color: #fff; animation: ring 1.8s infinite; }
.node.locked { opacity: .75; }
.node:active:not(.locked) { transform: translate(-50%, -50%) scale(.94); }
.node .lock { position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.node .lock svg { width: 12px; height: 12px; fill: none; stroke: var(--ink-soft); stroke-width: 2.6; stroke-linecap: round; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(224,58,62,.55), var(--shadow); } 70%, 100% { box-shadow: 0 0 0 16px rgba(224,58,62,0), var(--shadow); } }
.tag {
  position: absolute; transform: translateY(-50%); font: 700 12px var(--font-body); letter-spacing: .05em; text-transform: uppercase;
  color: var(--ink-soft); pointer-events: none; white-space: nowrap;
}
.tag.l { transform: translate(-100%, -50%); text-align: right; }
.vine-end { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; font: 600 15px var(--font-display); color: var(--ink-soft); }

/* board: white cube tiles with thin black arrows */
:root { --slab: #ffffff; --slab-side: #c3c8d0; --tl: 40%; --sl: 24%; --heart: #e5484d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --slab: #ffffff; --slab-side: #aab0b9; --tl: 64%; --sl: 30%; --heart: #ff6b6f; } }
:root[data-theme="dark"] { --slab: #ffffff; --slab-side: #aab0b9; --tl: 64%; --sl: 30%; --heart: #ff6b6f; }
.stagewrap { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
.stage { flex: 1; min-height: 0; display: flex; overflow: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 6px; touch-action: none; }
.board { position: relative; margin: auto; flex: none; touch-action: none; }
.board.soft { filter: drop-shadow(0 10px 10px rgba(20, 30, 60, .25)); }
.bsvg { display: block; width: 100%; height: auto; overflow: visible; }
.slabT { fill: var(--slab); }
.slabS { fill: var(--slab-side); }
.zoom { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
.zoom button { width: 48px; height: 48px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; }
.zoom svg { width: 20px; height: 20px; stroke: var(--ink); stroke-width: 2.8; stroke-linecap: round; fill: none; }
.zoom button:disabled { opacity: .4; }
.arw { cursor: pointer; }
.arw.esc { pointer-events: none; transition: none; }
.arw.gone { display: none; }
.arw .hit { fill: none; stroke: transparent; stroke-width: var(--hit, .75); stroke-linecap: round; stroke-linejoin: round; pointer-events: stroke; }
.arw .ln { fill: none; stroke-width: .12; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.arw .hd { stroke-width: .04; stroke-linejoin: round; pointer-events: none; }
.arw .ex.ln { stroke: #8f959e; }
.arw .ex.hd { fill: #8f959e; stroke: #8f959e; }
.arw .tp.ln { stroke: #101214; }
.arw .tp.hd { fill: #101214; stroke: #101214; }
.arw.blocker .tp.ln { stroke: var(--bad); } .arw.blocker .tp.hd { fill: var(--bad); stroke: var(--bad); }
.arw.shake { animation: shake .3s; }
.arw.shake .tp.ln { stroke: var(--bad); } .arw.shake .tp.hd { fill: var(--bad); stroke: var(--bad); }
.arw.hint .tp.ln { stroke: #2f64e8; stroke-width: .24; } .arw.hint .tp.hd { fill: #2f64e8; stroke: #2f64e8; }
@keyframes shake { 20% { transform: translate(-.12px, 0); } 50% { transform: translate(.12px, 0); } 80% { transform: translate(-.08px, 0); } }
.hearts { display: flex; justify-content: center; gap: 8px; flex: none; padding: 2px 0 6px; }
.heart { width: 46px; height: 42px; display: grid; place-items: center; border-radius: 12px; }
.heart svg { width: 32px; height: 30px; fill: var(--heart); stroke: var(--heart); stroke-width: 2; stroke-linejoin: round; transition: transform .2s; }
.heart.empty svg { fill: none; opacity: .6; }
.heart.lost svg { animation: pop .5s ease; }
.hearts .timer { align-self: center; font: 700 12px var(--font-body); color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 38px; }
.demo { width: min(70vw, 270px, 27vh); flex: none; display: grid; place-items: center; pointer-events: none; }
.demo .board { width: 100%; filter: drop-shadow(0 10px 8px rgba(20, 30, 60, .25)); }
.cost { display: inline-flex; align-items: center; gap: 5px; margin-left: 6px; }
.cost .coin-dot { width: 20px; height: 20px; font-size: 11px; }
.card .stack { display: flex; flex-direction: column; gap: 10px; }
.card .stack button { height: 52px; border-radius: 26px; font: 600 18px var(--font-display); background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
.card .stack button.main { background: var(--vine); color: #fff; box-shadow: 0 4px 0 var(--vine-deep); }
.card .stack button:disabled { opacity: .45; cursor: default; }
.foot { flex: none; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px)); }
.pill { height: 48px; padding: 0 18px; border-radius: 23px; background: var(--surface); box-shadow: var(--shadow); font: 600 16px var(--font-display); display: flex; align-items: center; gap: 8px; }
.pill:disabled { opacity: .45; cursor: default; }
.pill svg { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.pill .coin-dot { width: 20px; height: 20px; font-size: 11px; }
.left { font: 700 13px/1.3 var(--font-body); color: var(--ink-soft); min-width: 84px; text-align: center; font-variant-numeric: tabular-nums; }
.left b { color: var(--ink); font: 600 16px var(--font-display); }
.left.low b:last-child { color: var(--bad); }

/* win dialog */
.modal { position: absolute; inset: 0; background: rgba(10, 14, 28, .55); display: grid; place-items: center; padding: 20px; z-index: 20; }
.modal[hidden] { display: none; }
.card { width: min(360px, 100%); background: var(--surface); border-radius: 28px; padding: 28px 22px 22px; text-align: center; box-shadow: var(--shadow); animation: rise .35s ease; }
@keyframes rise { from { transform: translateY(24px) scale(.96); opacity: 0; } }
.card h3 { margin: 0; font: 700 30px var(--font-display); color: var(--vine); }
.card p { margin: 6px 0 0; color: var(--ink-soft); font-weight: 700; }
.earn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 20px 0; font: 700 40px var(--font-display); font-variant-numeric: tabular-nums; }
.earn .coin-dot { width: 40px; height: 40px; font-size: 20px; }
.bonus { font-size: 13px; font-weight: 800; color: var(--good); margin-top: -12px; margin-bottom: 18px; min-height: 16px; }
.card .row { display: flex; gap: 10px; }
.card .row button { flex: 1; height: 52px; border-radius: 26px; font: 600 18px var(--font-display); background: var(--surface-2); }
.card .row button.main { background: var(--vine); color: #fff; box-shadow: 0 4px 0 var(--vine-deep); }
#play .bar { position: relative; z-index: 25; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-weight: 800; font-size: 14px; padding: 9px 16px; border-radius: 18px; z-index: 30; white-space: nowrap; }
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: .01s !important; } }
</style>
</head><body>

<section class="screen" id="home">
  <div class="wrap bar"><span></span><div class="coins" data-coins aria-label="Coins"><span class="coin-dot">$</span><span class="n">0</span></div></div>
  <div class="wrap main">
    <div class="logo"><h1>Arrowvine</h1><p>Clear every arrow. Climb the vine.</p></div>
    <div class="demo" id="demo" aria-hidden="true"></div>
    <button class="play" id="playBtn" type="button"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>Play</button>
    <div class="theme">
      <span>Screen</span>
      <div class="seg" role="group" aria-label="Screen brightness">
        <button type="button" id="themeLight" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>Bright</button>
        <button type="button" id="themeDark" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Dark</button>
      </div>
    </div>
    <button class="linkish" id="unlockBtn" type="button">Unlock all levels</button>
  </div>
</section>

<section class="screen" id="map" hidden>
  <div class="wrap bar">
    <button class="round" id="mapBack" type="button" aria-label="Back to home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>The Vine<small id="mapSub">Level 1 of 1000</small></h2>
    <div class="coins" data-coins aria-label="Coins"><span class="coin-dot">$</span><span class="n">0</span></div>
  </div>
  <div class="scroller" id="scroller"><div class="vine" id="vine"></div></div>
</section>

<section class="screen" id="play" hidden>
  <div class="wrap bar">
    <button class="round" id="playBack" type="button" aria-label="Back to the vine"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="playTitle">Level 1<small>Circle</small></h2>
    <div class="coins" data-coins aria-label="Coins"><span class="coin-dot">$</span><span class="n">0</span></div>
  </div>
  <div class="hearts" id="hearts" aria-label="Lives"></div>
  <div class="stagewrap">
    <div class="stage" id="stage"><div class="board" id="board"></div></div>
    <div class="zoom">
      <button type="button" id="zIn" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" id="zOut" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    </div>
  </div>
  <div class="wrap foot">
    <button class="pill" id="restartBtn" type="button"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4.5h4.5"/></svg>Restart</button>
    <button class="pill" id="hintBtn" type="button"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Hint <span class="coin-dot">5</span></button>
  </div>
  <div class="modal" id="lose" hidden>
    <div class="card" role="dialog" aria-labelledby="loseTitle">
      <h3 id="loseTitle" style="color:var(--bad)">Out of lives</h3>
      <p id="loseSub">Buy a heart with your coins to keep going.</p>
      <div class="bonus" id="loseTimer" style="color:var(--ink-soft);margin:14px 0 16px"></div>
      <div class="stack">
        <button type="button" class="main" id="buyOne">Buy 1 life <span class="cost"><span class="coin-dot">$</span>30</span></button>
        <button type="button" id="buyAll">Refill all 3 <span class="cost"><span class="coin-dot">$</span>90</span></button>
        <button type="button" id="loseRestart">Restart level</button>
        <button type="button" id="loseMap">Back to the vine</button>
      </div>

  </div>
  <div class="modal" id="win" hidden>
    <div class="card" role="dialog" aria-labelledby="winTitle">
      <h3 id="winTitle">Level cleared!</h3>
      <p id="winSub">Circle</p>
      <div class="earn"><span class="coin-dot">$</span><span id="winCoins">+0</span></div>
      <div class="bonus" id="winBonus"></div>
      <div class="row"><button type="button" id="winMap">Vine</button><button type="button" class="main" id="winNext">Next</button></div>
    </div>
  </div>
  </section>
<div class="toast" id="toast" hidden></div>
<script>
/* Level generator. Shapes are masks on an n x n grid; arrows are assigned by
   peeling the shape from the outside in, so every level can be cleared. */
const Levels = (function () {
  const TOTAL = 1000, ARROW_CAP = 360, MAX_N = 50;
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // 0 up, 1 right, 2 down, 3 left

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pip(poly, x, y) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
    }
    return c;
  }
  const any = (polys, x, y) => polys.some((p) => pip(p, x, y));
  const circ = (x, y, cx, cy, r) => (x - cx) * (x - cx) + (y - cy) * (y - cy) <= r * r;
  const rad = (x, y) => Math.sqrt(x * x + y * y);
  const ang = (x, y) => Math.atan2(y, x);
  function starPoly(k, ro, ri) {
    const pts = [];
    for (let m = 0; m < k * 2; m++) {
      const r = m % 2 === 0 ? ro : ri, t = -Math.PI / 2 + (m * Math.PI) / k;
      pts.push([r * Math.cos(t), r * Math.sin(t)]);
    }
    return pts;

/* coins (chip is top right on every screen) */

/* lives: every round starts with 3 hearts; a lost heart can be bought back with coins */
const MAX_LIVES = 3, LIFE_COST = 30;

/* ---- the vine map: level 1 at the bottom, the last level at the top ---- */
const GAP = 98, PAD_TOP = 130, PAD_BOTTOM = 90, NS = 'http://www.w3.org/2000/svg';
let mapGeo = null;

function buildMap(scrollToCurrent) {
  const vine = $('#vine'), scroller = $('#scroller');
  const W = vine.clientWidth;
  if (!W) return;
  const prevTop = scroller.scrollTop;
  const H = PAD_TOP + (Levels.TOTAL - 1) * GAP + PAD_BOTTOM;
  const A = Math.min(W * 0.3, 120);
  const pt = (k) => ({ x: W / 2 + A * Math.sin((k - 1) * 0.82), y: H - PAD_BOTTOM - (k - 1) * GAP, k });

  const pts = [{ x: W / 2, y: H + 10 }];
  for (let k = 1; k <= Levels.TOTAL; k++) pts.push(pt(k));
  pts.push({ x: W / 2 + A * Math.sin(Levels.TOTAL * 0.82) * 0.6, y: 40 });

  /* smooth path through the level points (Catmull-Rom to cubic Bezier) */
  let d = `M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6, c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    segs.push([p1.x, p1.y, c1x, c1y, c2x, c2y, p2.x, p2.y]);
  }

  vine.style.height = H + 'px';
  vine.innerHTML = '';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('d', d); path.setAttribute('class', 'stem');
  const hi = path.cloneNode(); hi.setAttribute('class', 'stem-hi'); hi.setAttribute('transform', 'translate(-1.5 0)');
  svg.appendChild(path); svg.appendChild(hi);
  vine.appendChild(svg);

  /* leaves along the stem, placed straight from the curve segments (measuring a very long path is slow) */
  const r = Levels.rng(42);
  const bz = (s, t) => {
    const u = 1 - t, k0 = u * u * u, k1 = 3 * u * u * t, k2 = 3 * u * t * t, k3 = t * t * t;

  let leaves = '', side = 1;
  segs.forEach((sg) => {
    for (let t = 0.12 + r() * 0.2; t < 0.95; t += 0.3 + r() * 0.22) {
      const p = bz(sg, t), q = bz(sg, t + 0.02);

      side = -side;
    }

  const g = document.createElementNS(NS, 'g');
  g.innerHTML = leaves;
  svg.insertBefore(g, hi);

  /* level nodes + shape tags */
  const cur = currentLevel();
  const frag = document.createDocumentFragment();
  for (let k = 1; k <= Levels.TOTAL; k++) {
    const p = pts[k], open = unlocked(k);
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.k = k;
    b.className = 'node' + (S.done[k] ? ' done' : k === cur ? ' current' : '') + (open ? '' : ' locked');
    b.style.left = p.x + 'px'; b.style.top = p.y + 'px';
    const name = Levels.names[(k - 1) % 40];
    b.setAttribute('aria-label', `Level ${k}, ${name}${open ? '' : ', locked'}`);
    b.innerHTML = k + (open ? '' : '<span class="lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>');
    frag.appendChild(b);
    const t = document.createElement('span');
    const right = p.x < W / 2;
    t.className = 'tag' + (right ? '' : ' l');
    t.textContent = name;
    t.style.top = p.y + 'px';
    t.style.left = (p.x + (right ? 40 : -40)) + 'px';
    frag.appendChild(t);
  }
  const end = document.createElement('div');
  end.className = 'vine-end'; end.style.top = '8px'; end.textContent = 'Top of the vine';
  frag.appendChild(end);
  vine.appendChild(frag);

  mapGeo = { H, pts };
  $('#mapSub').textContent = `Level ${cur} of ${Levels.TOTAL}`;
  if (scrollToCurrent) scroller.scrollTop = Math.max(0, pts[cur].y - scroller.clientHeight * 0.62);
  else scroller.scrollTop = prevTop;
}

  const b = e.target.closest('.node');
  if (!b) return;
  const k = +b.dataset.k;
  if (!unlocked(k)) { toast(`Clear level ${currentLevel()} first`); return; }
  startLevel(k);
});
/* ---- 3D board: slab tiles with extruded arrow lines ---- */
const HUES = [38, 198, 285, 152, 350];
function arrowPath(a) { return 'M' + a.cells.map(([x, y]) => `${x + 0.5} ${y + 0.5}`).join('L'); }
function headPoly(a) {
  const dx = Levels.DX[a.d], dy = Levels.DY[a.d], cx = a.i + 0.5, cy = a.j + 0.5, px = -dy, py = dx;
  const pt = (f, s) => `${(cx + dx * f + px * s).toFixed(3)} ${(cy + dy * f + py * s).toFixed(3)}`;
  return `${pt(0.48, 0)} ${pt(-0.1, 0.27)} ${pt(-0.1, -0.27)}`;
}
function mkBoard(host, lv) {
  const n = lv.n;
  let slabS = '', slabT = '', arr = '';
  lv.mask.forEach(([i, j]) => {
    slabS += `<rect class="slabS" x="${i + 0.04}" y="${j + 0.24}" width="0.92" height="0.76" rx="0.1"/>`;
    slabT += `<rect class="slabT" x="${i + 0.04}" y="${j + 0.04}" width="0.92" height="0.76" rx="0.1"/>`;
  });
  lv.arrows.forEach((a, k) => {
    const d = arrowPath(a), h = headPoly(a);
    arr += `<g class="arw" data-idx="${k}" style="--h:${HUES[k % HUES.length]}">` +
      `<g transform="translate(0 0.07)"><path class="ln ex" d="${d}"/><polygon class="hd ex" points="${h}"/></g>` +
      `<path class="ln tp" d="${d}"/><polygon class="hd tp" points="${h}"/><path class="hit" d="${d}"/></g>`;
  });
  host.innerHTML = `<svg class="bsvg" viewBox="-0.5 -0.5 ${n + 1} ${n + 1.9}" role="img" aria-label="Arrow puzzle">${slabS}${slabT}${arr}</svg>`;
  return Array.from(host.querySelectorAll('.arw'));
}
/* escape: the arrow slithers along its own path, the body following the head round each bend, then out past the edge */
const calmMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function headAt(x, y, dx, dy) {

  return `${pt(0.48, 0)} ${pt(-0.1, 0.27)} ${pt(-0.1, -0.27)}`;
}
function flyOut(g, a, n) {

  if (calmMotion) { g.style.transition = 'opacity .2s'; g.style.opacity = 0; setTimeout(() => g.classList.add('gone'), 220); return 220; }
  const dx = Levels.DX[a.d], dy = Levels.DY[a.d];
  const pts = a.cells.map(([x, y]) => [x + 0.5, y + 0.5]);
  let body = 0;
  for (let k = 1; k < pts.length; k++) body += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
  const edge = dx > 0 ? n - a.i - 0.5 : dx < 0 ? a.i + 0.5 : dy > 0 ? n - a.j - 0.5 : a.j + 0.5;

    for (let k = tl.k; k < h.k; k++) d += `L${pts[k][0].toFixed(3)} ${pts[k][1].toFixed(3)}`;
    d += `L${h.x.toFixed(3)} ${h.y.toFixed(3)}`;

    const poly = headAt(h.x, h.y, h.ux, h.uy);

/* ---- home demo: a small board that clears itself on a loop ---- */

/* ---- game ---- */
let G = null;
/* zoom: the board is fitted to the screen, then scaled up so dense boards stay tappable */
const Z_MAX = 7;
function fitSide() {
  const stage = $('#stage'), n = G.lv.n;
  const w = stage.clientWidth - 12, h = stage.clientHeight - 12;
  return Math.max(140, Math.min(w, 620, (h * (n + 1)) / (n + 1.9)));
}
const clampZoom = (z) => Math.max(1, Math.min(Z_MAX, z));
/* board width follows the zoom; the invisible tap area around each arrow stays at least ~15px wide on screen */
function applySize() {
  const board = $('#board'), n = G.lv.n, fit = fitSide();
  const w = Math.round(fit * G.zoom), cell = w / (n + 1);
  board.style.width = w + 'px';
  board.style.setProperty('--hit', Math.max(0.75, Math.min(2.4, 15 / cell)).toFixed(2));
  $('#zIn').disabled = G.zoom >= Z_MAX - 0.01;
  $('#zOut').disabled = G.zoom <= 1.01;
}
function sizeBoard(keepView) {
  if (!G) return;
  const stage = $('#stage'), n = G.lv.n;
  if (!G.zoom) G.zoom = clampZoom(13 / (fitSide() / (n + 1)));
  const fx = keepView ? (stage.scrollLeft + stage.clientWidth / 2) / Math.max(1, stage.scrollWidth) : 0.5;
  const fy = keepView ? (stage.scrollTop + stage.clientHeight / 2) / Math.max(1, stage.scrollHeight) : 0.5;

  stage.scrollTop = fy * stage.scrollHeight - stage.clientHeight / 2;
}
/* zoom while keeping the point under (cx, cy) fixed on screen */
function zoomAt(z, cx, cy) {

  const fx = (stage.scrollLeft + px) / Math.max(1, stage.scrollWidth), fy = (stage.scrollTop + py) / Math.max(1, stage.scrollHeight);

  stage.scrollTop = fy * stage.scrollHeight - py;
}
function zoomBy(f) {

$('#zIn').onclick = () => zoomBy(1.4);

/* touch: one finger drags the board, two fingers pinch to zoom; a drag never counts as a tap */
const gest = { moved: false, pinch: null, pan: null }, ptrs = new Map();
(function () {

})();

$('#board').addEventListener('click', (e) => {

  setTimeout(() => { el.classList.remove('shake'); if (be) be.classList.remove('blocker'); }, 700);
  try { navigator.vibrate && navigator.vibrate(30); } catch (err) {}
  if (G.lives <= 0) { G.busy = true; setTimeout(openLose, 450); }
});

$('#restartBtn').onclick = () => { if (G) startLevel(G.k); };
$('#hintBtn').onclick = () => {
  if (!G || G.busy) return;
  if (S.coins < 5) { toast('You need 5 coins for a hint'); return; }
  const grid = Levels.aliveGrid(G.lv, G.flags), free = [];
  G.lv.arrows.forEach((a, i) => { if (G.flags[i] && Levels.isFree(grid, G.lv.n, a)) free.push(i); });
  if (!free.length) return;
  const el = G.els[free[Math.floor(Math.random() * free.length)]];
  addCoins(-5);
  el.classList.add('hint');
  setTimeout(() => el.classList.remove('hint'), 2500);
};

function winLevel() {
  const k = G.k, replay = !!S.done[k];
  let gain = Levels.reward(k, G.lv.count, G.mistakes);
  if (replay) gain = Math.max(1, Math.ceil(gain / 4));
  S.done[k] = true;
  $('#winTitle').textContent = G.mistakes === 0 ? 'Perfect clear!' : 'Level cleared!';
  $('#winSub').textContent = `Level ${k} · ${G.lv.name}`;
  $('#winCoins').textContent = '+' + gain;
  $('#winBonus').textContent = replay ? 'Replay reward' : G.mistakes === 0 ? 'No wrong taps: +10 bonus included' : '';
  $('#winNext').hidden = k >= Levels.TOTAL;
  $('#win').hidden = false;
  addCoins(gain);
}
$('#winNext').onclick = () => startLevel(Math.min(Levels.TOTAL, G.k + 1));
$('#winMap').onclick = () => show('map');

/* ---- boot ---- */
applyTheme();
paintCoins(S.coins);
$('#unlockBtn').textContent = S.all ? 'Lock levels again' : 'Unlock all levels';
show('home');
</script>
<script>if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });</script>
